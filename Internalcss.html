<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body {
            background-color: lightyellow;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        h2 {
            color: darkgreen;
        }

        p {
            color: brown;
            font-size: 18px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
        }
    </style>
</head>

<body>

    <h1>Welcome to ABC College</h1>

    <h2>Department of Computer Science</h2>

    <p>
        We are learning Internal CSS in
        Full Stack Frontend Development.
    </p>

    <p>
        Internal CSS can style multiple elements
        within the same webpage.
    </p>

    <button>Learn More</button>

</body>
</html>
