<html>
<head>
    <title>Table Example</title>
</head>
<body>

    <h1>Student Grades</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>John Doe</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Jane Smith</td>
            <td>B</td>
        </tr>
    </table>

</body>
</html>
