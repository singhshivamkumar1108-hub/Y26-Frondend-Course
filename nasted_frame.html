<!DOCTYPE html>
<html>
<head>
    <title>Nested Frames - HTML5</title>
</head>

<body  bg color="blue" scrolling="yes" style="margin: 0; height: 100vh; display: flex; flex-direction: column;">

    <!-- Top Frame -->
    <iframe src="top.html"
        style="width: 100%; height: 25%; border: 2px solid black;">
    </iframe>

    <!-- Bottom Frames -->
    <div style="display: flex; height: 75%; width: 100%;">

        <iframe src="left.html"
            style="width: 30%; height: 100%; border: 2px solid black;">
        </iframe>

        <iframe src="right.html"
            style="width: 70%; height: 100%; border: 2px solid black;">
            if you are seeing this message, your browser does not support iframes.
        </iframe>

    </div>

</body>
</html>
