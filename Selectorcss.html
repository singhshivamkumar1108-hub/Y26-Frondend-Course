<!DOCTYPE html>
<html>
<head>
    <title>CSS ID Selector Example</title>

    <style>
        #title {
            color: red;
            text-align: center;
            font-size: 35px;
            background-color: lightyellow;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1 id="title">Welcome to CSS</h1>

    <h2>Learning CSS Selectors</h2>

    <p>
        CSS ID selector is used to apply styles
        to a particular HTML element.
    </p>

</body>
</html>
