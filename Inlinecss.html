<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body>

    <h1 style="color: blue; text-align: center;">
        Welcome to ABC College
    </h1>

    <p style="color: green; font-size: 20px;">
        This paragraph uses inline CSS.
    </p>

    <h2 style="background-color: yellow; padding: 10px;">
        Full Stack Frontend Development
    </h2>

    <button style="background-color: blue;
                   color: white;
                   padding: 10px 20px;
                   border: none;">
        Click Me
    </button>

</body>
</html>
